name: VocesLeft CI/CD

on:
  pull_request:
    branches: [development, testing, master]
    paths:
      - "relay-server/**"
      - "scripts/deploy-vps.sh"
      - "Makefile"
      - ".github/workflows/pipeline.yml"
  push:
    branches: [development, testing, master]
    paths:
      - "relay-server/**"
      - "scripts/deploy-vps.sh"
      - "Makefile"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Ambiente a desplegar (none solo compila y prueba)"
        required: true
        default: none
        type: choice
        options:
          - none
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: vocesleft-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ddsr1809/vocesleft-relay

jobs:
  verificar-backend:
    name: Probar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay-server
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ejecutar pruebas
        run: ./gradlew test --no-daemon

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-backend
          path: relay-server/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  construir-imagen:
    name: Construir imagen
    needs: verificar-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      imagen: ${{ steps.imagen.outputs.valor }}
      version: ${{ steps.imagen.outputs.version }}
      lanzamiento: ${{ steps.imagen.outputs.lanzamiento }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nombre inmutable de imagen
        id: imagen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta_ref="${GITHUB_REF_NAME//\//-}"
          valor="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          # La version del servidor es la de build.gradle.kts.
          version="$(sed -n 's/^version = "\([^"]*\)".*/\1/p' relay-server/build.gradle.kts)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No se pudo leer la version de relay-server/build.gradle.kts (se esperaba X.Y.Z)." >&2
            exit 1
          fi

          # Un lanzamiento es la primera vez que una version llega a master:
          # todavia no existe su tag vX.Y.Z. Solo entonces la imagen recibe
          # tambien el numero de version, para que :X.Y.Z no cambie despues.
          lanzamiento=false
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_NAME" == "master" ]]; then
            tag_existente="$(git ls-remote --tags \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/v${version}")"
            if [[ -z "$tag_existente" ]]; then
              lanzamiento=true
            else
              echo "::warning::La version ${version} ya se publico (existe el tag v${version}). Esta imagen solo se identifica por su commit; sube la version en relay-server/build.gradle.kts para publicar otra."
            fi
          fi

          {
            echo "valor=${valor}"
            echo "version=${version}"
            echo "lanzamiento=${lanzamiento}"
            echo "etiquetas<<FIN_ETIQUETAS"
            echo "${valor}"
            echo "${REGISTRY}/${IMAGE_NAME}:${etiqueta_ref}"
            if [[ "$lanzamiento" == "true" ]]; then
              echo "${REGISTRY}/${IMAGE_NAME}:${version}"
            fi
            echo "FIN_ETIQUETAS"
          } >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: relay-server
          file: relay-server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.imagen.outputs.etiquetas }}
          # El servidor ensena este commit en GET /api/servidor.
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar al VPS
    needs: construir-imagen
    # development no despliega: es el ambiente developer, que corre en local.
    # testing despliega al servidor de pruebas y master a produccion.
    if: >-
      (github.event_name == 'push' &&
       (github.ref_name == 'testing' || github.ref_name == 'master')) ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.ambiente == 'test' ||
        (inputs.ambiente == 'prod' && github.ref_name == 'master')))
    runs-on: ubuntu-latest
    concurrency:
      group: vocesleft-vps-deploy
      cancel-in-progress: false
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.ambiente || (github.ref_name == 'master' && 'prod' || 'test') }}
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Elegir ambiente
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "DEPLOY_ENV=${{ inputs.ambiente }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.ref_name }}" == "master" ]]; then
            echo "DEPLOY_ENV=prod" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_ENV=test" >> "$GITHUB_ENV"
          fi

      - name: Configurar SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Desplegar y comprobar salud
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/deploy-vps.sh
          scripts/deploy-vps.sh "$DEPLOY_ENV" "${{ needs.construir-imagen.outputs.imagen }}"

  etiquetar-version:
    name: Etiquetar version
    # Solo cuando una version nueva llego a master y produccion quedo sana:
    # si el despliegue falla no hay tag, y el siguiente intento vuelve a
    # contar como lanzamiento de la misma version.
    needs: [construir-imagen, desplegar]
    if: needs.construir-imagen.outputs.lanzamiento == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear el tag de la version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.construir-imagen.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/v${VERSION}" \
            -f "sha=${GITHUB_SHA}" >/dev/null
          {
            echo "Version ${VERSION} publicada."
            echo ""
            echo "- Tag: v${VERSION}"
            echo "- Imagen: ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"

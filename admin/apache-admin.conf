# Pegar DENTRO de los vhosts de Apache, antes de la línea "ProxyPass /":
#   /etc/apache2/sites-available/ythub.d2600.com-le-ssl.conf
#   /etc/apache2/sites-available/testhub.d2600.com-le-ssl.conf  (si existe)
#
# Así /admin lo sirve Apache desde la carpeta del repositorio y todo lo demás
# sigue yendo al relay-server. Las llamadas del panel a /api/... van al mismo
# dominio, sin CORS.

# El orden importa: la excepción debe ir antes del ProxyPass general.
ProxyPass /admin !

RedirectMatch 301 ^/admin$ /admin/
Alias /admin/ /opt/tubehub/admin/

<Directory /opt/tubehub/admin>
    Options -Indexes
    Require all granted
    DirectoryIndex index.html
</Directory>

# Opcional, requiere "a2enmod headers": evita que el navegador se quede con
# una versión vieja del panel después de un git pull, y que lo indexen.
<IfModule mod_headers.c>
    <LocationMatch "^/admin/">
        Header set Cache-Control "no-cache"
        Header set X-Robots-Tag "noindex, nofollow"
    </LocationMatch>
</IfModule>

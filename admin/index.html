<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel de VocesLeft</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="ambiente" id="ambiente" hidden></div>

<section class="puerta" id="puerta">
  <div class="puerta-caja">
    <div class="marca">V</div>
    <h1>Panel de VocesLeft</h1>
    <p>Entra con la cuenta de Google que tiene rol de administrador.</p>
    <div id="botonGoogle"><span class="muted">Cargando…</span></div>
    <div class="puerta-error" id="puertaError" hidden></div>
  </div>
</section>

<div class="shell" id="app" hidden>
  <aside>
    <div class="brand"><div class="marca">V</div><b>VocesLeft</b></div>
    <nav id="nav" aria-label="Secciones">
      <button data-vista="resumen">Resumen</button>
      <button data-vista="creadores">Creadores</button>
      <button data-vista="productoras">Productoras</button>
      <button data-vista="canales">Canales<span class="cuenta" id="n-susc" hidden></span></button>
      <button data-vista="publicaciones">Publicaciones</button>
      <button data-vista="reportes">Reportes<span class="cuenta" id="n-rep" hidden></span></button>
      <button data-vista="usuarios">Usuarios</button>
      <button data-vista="administradores">Administradores</button>
      <button class="solo-movil" id="salirMovil">Cerrar sesión</button>
    </nav>
    <div class="quien"><span id="quien"></span><br><button id="salir">Cerrar sesión</button></div>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="modal" aria-labelledby="mTitulo">
  <div class="m-head"><h2 id="mTitulo"></h2></div>
  <div class="m-body" id="mCuerpo"></div>
  <div class="m-foot" id="mPie"></div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>

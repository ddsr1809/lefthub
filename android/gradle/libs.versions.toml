[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigation = "2.8.5"
firebaseBom = "33.7.0"
googleServices = "4.4.2"
credentials = "1.3.0"
googleid = "1.1.1"
playServicesAuth = "21.5.0"
coil = "2.7.0"
coroutines = "1.9.0"
okhttp = "4.12.0"
# Anuncios y compra. Van fijadas a versiones que se llevan bien con la
# combinación conservadora de arriba (AGP 8.7.3 + Kotlin 2.1.0 + compileSdk 35):
#  · play-services-ads 24.9.0 es la última de la serie 24. La 25 sube
#    requisitos; pásate a ella cuando subas el AGP y Kotlin.
#  · billing 8.3.0: Google Play exige la serie 8 o posterior. Es el artefacto
#    de Java (sin -ktx) a propósito, para no atarse a la versión de Kotlin.
playServicesAds = "24.9.0"
ump = "3.2.0"
billing = "8.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }

# Lo unico de Firebase que queda: FCM, la unica via para entregar push a
# Android. Auth y Firestore se fueron: ahora los cubre nuestro servidor.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

# Credential Manager: reemplaza al obsoleto GoogleSignInClient.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# AuthorizationClient: pide permisos sobre datos de Google (aquí, leer las
# suscripciones de YouTube). Credential Manager solo dice QUIÉN es la persona;
# esto es lo que da acceso a sus datos, y Google exige que sean flujos aparte.
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }

# Cliente HTTP del servidor Relé. Reemplaza a firebase-functions, que solo
# sabía hablar con Cloud Functions callable.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# AdMob: los anuncios de Novedades. UMP es el formulario de consentimiento de
# Google, obligatorio para mostrar anuncios a quien está en Europa y en
# algunos estados de EE. UU.; donde no hace falta, no enseña nada.
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }

# Google Play Billing: la compra única que quita los anuncios.
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

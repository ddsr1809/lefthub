# Desarrollo local de VocesLeft. En el VPS se usa docker-compose.vps.yml.
# Los datos de Postgres viven en un volumen y sobreviven a las actualizaciones.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: ${DB_MEMORIA:-384m}
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-relay}
      POSTGRES_USER: ${DB_USUARIO:-relay}
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en el archivo .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # Sin `ports`: Postgres solo es accesible desde la red interna de Compose.
    # Para administrarlo desde fuera del VPS se debe utilizar un tunel SSH.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-relay} -d ${DB_NOMBRE:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  servidor:
    image: ${SERVIDOR_IMAGEN:-vocesleft-relay:local}
    build: .
    restart: unless-stopped
    mem_limit: ${SERVIDOR_MEMORIA:-640m}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PUERTO_HOST:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NOMBRE:-relay}
      DB_USUARIO: ${DB_USUARIO:-relay}
      DB_CLAVE: ${DB_CLAVE}
      RELAY_URL_PUBLICA: ${RELAY_URL_PUBLICA}
      JWT_SECRETO: ${JWT_SECRETO}
      WEBSUB_SECRETO: ${WEBSUB_SECRETO}
      WEBSUB_TOKEN_CALLBACK: ${WEBSUB_TOKEN_CALLBACK}
      TOKEN_INTERNO: ${TOKEN_INTERNO}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      # Opcional. Sin clave, el servicio de fotos de perfil da 25 al dia.
      FOTOS_API_KEY: ${FOTOS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FCM_PROYECTO_ID: ${FCM_PROYECTO_ID}
      FCM_CREDENCIALES: /secretos/fcm.json
      CORS_ORIGENES: ${CORS_ORIGENES}
      REPLICA_URL: ${REPLICA_URL:-}
      REPLICA_TOKEN: ${REPLICA_TOKEN:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_CLAVE_PRIVADA: ${APPLE_CLAVE_PRIVADA:-}
    volumes:
      # Solo lectura: el contenedor nunca debe modificar la clave de FCM.
      - ${FCM_CREDENCIALES_HOST}:/secretos/fcm.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  datos_postgres:

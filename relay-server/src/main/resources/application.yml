server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: relay-server
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    default-property-inclusion: non_null
  threads:
    # Hilos virtuales. Este servidor pasa casi todo su tiempo esperando red:
    # el hub de Google, la Data API, FCM. Con hilos de plataforma cada espera
    # bloquea un hilo del sistema; con virtuales, no.
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/relay}
    username: ${DB_USUARIO:relay}
    password: ${DB_CLAVE:relay}
    hikari:
      maximum-pool-size: ${DB_POOL:10}
      connection-timeout: 10000

  jpa:
    hibernate:
      # El esquema lo gestiona Flyway, no Hibernate. 'validate' comprueba al
      # arrancar que las entidades cuadran con las tablas y falla si no, que
      # es infinitamente mejor que descubrirlo en la primera consulta.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.tuempresa.relay: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# ---------------------------------------------------------------------------
# Configuración propia
# ---------------------------------------------------------------------------
relay:
  # URL pública de ESTE servidor. El hub de Google la usa para verificar la
  # suscripción y para entregar los avisos. Sin ella no llega nada.
  url-publica: ${RELAY_URL_PUBLICA:}

  jwt:
    # Clave con la que firmamos los tokens de sesión. Mínimo 32 caracteres.
    #   openssl rand -hex 32
    # Cambiarla invalida todas las sesiones abiertas.
    secreto: ${JWT_SECRETO:}
    emisor: relay
    dias-validez: 30

  websub:
    hub: https://pubsubhubbub.appspot.com/subscribe
    secreto: ${WEBSUB_SECRETO:}
    token-callback: ${WEBSUB_TOKEN_CALLBACK:}
    lease-segundos: 864000
    # Al suscribirnos a un canal, el hub reenvía entradas recientes del feed.
    # Sin este corte avisaríamos de videos viejos como si acabaran de salir.
    antiguedad-maxima-horas: 6

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    # Las direcciones de YouTube. No hay que tocarlas: existen como variables
    # solo para poder apuntar las pruebas a un servidor de pega.
    api-base: ${YOUTUBE_API_BASE:https://www.googleapis.com/youtube/v3}
    url-shorts: ${YOUTUBE_URL_SHORTS:https://www.youtube.com/shorts/}

  fotos:
    # El servicio que encuentra la foto de perfil de una cuenta de X,
    # Instagram, TikTok... Solo se usa desde el panel, al pulsar el botón.
    # Sin clave da 25 fotos al día, que sobra para dar de alta creadores.
    base: ${FOTOS_BASE:https://unavatar.io}
    api-key: ${FOTOS_API_KEY:}

  perfiles:
    # El servicio que lee el nombre y la descripción del perfil de una cuenta
    # de X, Instagram, TikTok... para rellenar la ficha desde el panel.
    # Sin clave da 25 consultas al día.
    base: ${PERFILES_BASE:https://api.microlink.io}
    api-key: ${PERFILES_API_KEY:}

  fcm:
    # ID del proyecto de Firebase y ruta al JSON de la cuenta de servicio.
    # Es lo único que sigue siendo de Google, y no cuesta nada: FCM es
    # gratis e ilimitado, y es la única vía de entregar push a Android e iOS.
    proyecto-id: ${FCM_PROYECTO_ID:}
    credenciales: ${FCM_CREDENCIALES:}

  compras:
    # Quitar los anuncios pagando, en Google Play. Sin COMPRAS_PAQUETE la app
    # no ofrece la compra (los folios de regalo funcionan igual).
    #
    # paquete: el applicationId con el que la app está en Play Console.
    # producto: el ID del producto de pago único, como se dio de alta allí.
    paquete: ${COMPRAS_PAQUETE:}
    producto: ${COMPRAS_PRODUCTO:sin_anuncios}
    # La cuenta de servicio que le pregunta a Google si una compra es de
    # verdad. Por defecto es la misma de FCM: solo hay que invitarla en Play
    # Console (ver "Anuncios" en el README). Pon otra ruta si prefieres una
    # cuenta aparte.
    credenciales: ${COMPRAS_CREDENCIALES:${FCM_CREDENCIALES:}}

  google:
    # client_id de tipo web. Se usa como audiencia al verificar los tokens
    # que mandan las apps tras el inicio de sesión con Google.
    client-id: ${GOOGLE_CLIENT_ID:}

  apple:
    bundle-id: ${APPLE_BUNDLE_ID:}
    team-id: ${APPLE_TEAM_ID:}
    key-id: ${APPLE_KEY_ID:}
    clave-privada: ${APPLE_CLAVE_PRIVADA:}

  renovacion:
    # Con el servidor siempre encendido en tu VPS, esto basta y no hace falta
    # ningún programador externo.
    programada: ${RENOVACION_PROGRAMADA:true}
    cron: "0 0 4 */4 * *"
    zona: America/Hermosillo
    token-interno: ${TOKEN_INTERNO:}

  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5000}

  replica:
    # Solo en producción: URL del servidor de testing. Cada creador que se
    # guarda en el panel se copia allá. Vacío = no se copia nada.
    url: ${REPLICA_URL:}
    # El mismo valor en producción y en testing. Testing solo acepta copias
    # que lo traigan; sin token, la ruta de entrada no existe.
    token: ${REPLICA_TOKEN:}
